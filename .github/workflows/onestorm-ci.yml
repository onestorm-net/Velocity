name: OneStorm CI

on:
  push:
    branches: [onestorm-main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [onestorm-main]
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

  deploy:
    name: Deploy API
    if: github.ref == 'refs/heads/onestorm-main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set build version
        run: |
          BASE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | sed 's/-SNAPSHOT$//')
          echo "BUILD_VERSION=${BASE_VERSION}-BUILD.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Deploy API
        run: ./gradlew -Pversion="$BUILD_VERSION" :velocity-api:publishMavenPublicationToOnestormRepository
        env:
          ORG_GRADLE_PROJECT_onestormUsername: github
          ORG_GRADLE_PROJECT_onestormPassword: ${{ secrets.REPOSILITE_TOKEN }}
